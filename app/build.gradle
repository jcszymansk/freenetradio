apply plugin: "com.android.application"
apply plugin: "kotlin-android"
apply from: "../constants.gradle"
apply from: "../sign.gradle"

android {
    namespace = "com.yuriy.openradio.mobile"
    compileSdk project.ext.compileSdkVersion

    defaultConfig {
        applicationId project.ext.applicationId
        minSdkVersion project.ext.minSdkVersion
        targetSdkVersion project.ext.targetSdkVersion
        versionCode project.ext.versionCode
        versionName project.ext.versionName
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true

        testInstrumentationRunner "com.yuriy.openradio.testing.OfflineTestRunner"
    }

    buildTypes {
        debug {
            enableUnitTestCoverage true
            enableAndroidTestCoverage true
        }
    }

    compileOptions {
        sourceCompatibility project.ext.javaVersion
        targetCompatibility project.ext.javaVersion
    }

    kotlinOptions {
        jvmTarget = project.ext.kotlinJvmTarget
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
    packagingOptions {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES.txt',
                    'META-INF/LICENSE.md',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE.md',
                    'META-INF/NOTICE.txt',
                    'META-INF/NOTICE',
                    'META-INF/LICENSE',
                    'META-INF/DEPENDENCIES',
                    'META-INF/notice.txt',
                    'META-INF/license.txt',
                    'META-INF/dependencies.txt',
                    'META-INF/LGPL2.1'
            ]
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation project(':common')
    implementation project(':common-ui')

    androidTestImplementation(
            "androidx.test.espresso:espresso-core:$espressoVersion",
            {exclude group: "com.android.support", module: "support-annotations"}
    )
    androidTestImplementation "androidx.test.ext:junit:$junitAndroidXVersion"
    // The Room API cache is exercised through its DAO, which :common keeps off the app classpath.
    androidTestImplementation "androidx.room:room-runtime:$roomVersion"
    // The service contract tests drive a real MediaBrowser and read the root hints the service
    // publishes. :common keeps both artifacts off the app classpath.
    androidTestImplementation "androidx.media3:media3-session:$media3Version"
    androidTestImplementation "androidx.media:media:$androidxMediaVersion"
}
