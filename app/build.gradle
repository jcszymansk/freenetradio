import com.android.build.api.variant.HostTestBuilder

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.plugin.compose"
apply plugin: "io.github.takahirom.roborazzi"
apply from: "../constants.gradle"
apply from: "../sign.gradle"

android {
    namespace = "com.yuriy.openradio.mobile"
    compileSdk project.ext.compileSdkVersion

    defaultConfig {
        applicationId project.ext.applicationId
        minSdkVersion project.ext.minSdkVersion
        targetSdkVersion project.ext.targetSdkVersion
        versionCode project.ext.versionCode
        versionName project.ext.versionName

        testInstrumentationRunner "com.yuriy.openradio.testing.OfflineTestRunner"
    }

    buildTypes {
        debug {
            enableUnitTestCoverage = true
            enableAndroidTestCoverage = true
        }
    }

    compileOptions {
        sourceCompatibility project.ext.javaVersion
        targetCompatibility project.ext.javaVersion
    }

    buildFeatures {
        compose = true
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }
    packagingOptions {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES.txt',
                    'META-INF/LICENSE.md',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE.md',
                    'META-INF/NOTICE.txt',
                    'META-INF/NOTICE',
                    'META-INF/LICENSE',
                    'META-INF/DEPENDENCIES',
                    'META-INF/notice.txt',
                    'META-INF/license.txt',
                    'META-INF/dependencies.txt',
                    'META-INF/LGPL2.1'
            ]
        }
    }

    lint {
        lintConfig = rootProject.file("lint.xml")
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(project.ext.kotlinJvmTarget))
    }
}

// The recorded screenshots in src/test/screenshots are the baselines: check verifies every
// screenshot against them, so a visual change fails the build until it is recorded on purpose.
tasks.named("check") {
    dependsOn "verifyRoborazziDebug"
}

// ui-test-manifest declares the ComponentActivity that createComposeRule launches; keep it out of
// the release APK, so the release unit tests are disabled.
androidComponents {
    beforeVariants(selector().withBuildType("release")) { variant ->
        variant.hostTests[HostTestBuilder.UNIT_TEST_TYPE]?.enable = false
    }
}

dependencies {
    implementation project(':common')
    implementation project(':common-ui')
    implementation "com.github.jcszymansk.console:design"

    testImplementation platform("androidx.compose:compose-bom:$composeBomVersion")
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:$robolectricVersion"
    testImplementation "io.github.takahirom.roborazzi:roborazzi:$roborazziVersion"
    testImplementation "io.github.takahirom.roborazzi:roborazzi-compose:$roborazziVersion"
    testImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation platform("androidx.compose:compose-bom:$composeBomVersion")
    debugImplementation "androidx.compose.ui:ui-test-manifest"

    androidTestImplementation "androidx.test.espresso:espresso-core:$espressoVersion"
    androidTestImplementation "androidx.test.ext:junit:$junitAndroidXVersion"
    // The Room API cache is exercised through its DAO, which :common keeps off the app classpath.
    androidTestImplementation "androidx.room:room-runtime:$roomVersion"
    // The service contract tests drive a real MediaBrowser and read the root hints the service
    // publishes. :common keeps both artifacts off the app classpath.
    androidTestImplementation "androidx.media3:media3-session:$media3Version"
    androidTestImplementation "androidx.media:media:$androidxMediaVersion"
}
