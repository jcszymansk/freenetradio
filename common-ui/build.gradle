apply plugin: "com.android.library"
apply from: "../constants.gradle"

android {
    namespace = "com.yuriy.openradio.shared"
    compileSdk project.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion project.ext.minSdkVersion
        targetSdkVersion project.ext.targetSdkVersion
    }

    buildTypes {
        debug {
            enableUnitTestCoverage true
            enableAndroidTestCoverage true
        }
    }

    compileOptions {
        sourceCompatibility project.ext.javaVersion
        targetCompatibility project.ext.javaVersion
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        lintConfig = rootProject.file("lint.xml")
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(project.ext.kotlinJvmTarget))
    }
}

dependencies {
    implementation project(':common')
    implementation "androidx.constraintlayout:constraintlayout:$constraintlayoutAndroidXVersion"
    implementation "androidx.fragment:fragment-ktx:$fragmentKtxVersion"
    testImplementation group: "junit", name: "junit", version: "$junitVersion"
    testRuntimeOnly project(":android-jvm-stubs")
}
