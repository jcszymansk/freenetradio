apply plugin: "java-library"
apply plugin: "kotlin"
apply from: "../constants.gradle"

/**
 * The stubs replace framework classes, so they compile against the platform they replace.
 */
def androidSdkDir = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
def localProperties = rootProject.file("local.properties")
if (localProperties.exists()) {
    def properties = new Properties()
    localProperties.withInputStream { properties.load(it) }
    androidSdkDir = properties.getProperty("sdk.dir", androidSdkDir)
}
if (androidSdkDir == null) {
    throw new GradleException("Set ANDROID_HOME or local.properties sdk.dir to build :android-jvm-stubs")
}
def platformDir = "$androidSdkDir/platforms/android-${project.ext.compileSdkVersion}"
def androidJar = file("$platformDir/android.jar")
if (!androidJar.exists()) {
    // Preview and minor-suffixed platforms install as android-<api>.<minor>.
    androidJar = file("${platformDir}.0/android.jar")
}
if (!androidJar.exists()) {
    throw new GradleException("Missing $platformDir/android.jar; install the API ${project.ext.compileSdkVersion} platform")
}

java {
    sourceCompatibility = project.ext.javaVersion
    targetCompatibility = project.ext.javaVersion
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(project.ext.kotlinJvmTarget))
    }
}

dependencies {
    compileOnly files(androidJar)
    testImplementation "junit:junit:$junitVersion"
}
