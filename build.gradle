buildscript {

    apply from: "constants.gradle"

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$gradleVersion"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    }
}

plugins {
    id("com.google.devtools.ksp") version "1.9.0-1.0.13" apply false
}

allprojects {

    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}

tasks.register('localCoverageReport') {
    dependsOn ':common:createDebugUnitTestCoverageReport',
            ':common-ui:createDebugUnitTestCoverageReport'
}

tasks.register('instrumentedCoverageReport') {
    dependsOn ':app:createDebugAndroidTestCoverageReport'
}

apply from: "gradle/pure-core-coverage.gradle"

// The root project applies no plugin that would give it a check lifecycle
// task, so `./gradlew check` would only reach the modules' own checks and
// never the pure-core gate.
tasks.register('check') {
    group = 'verification'
    description = 'Runs the root project checks, which is the pure-core coverage gate.'
    dependsOn 'verifyPureCoreCoverage'
}
